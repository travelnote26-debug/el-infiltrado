<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#04050c">
  <meta name="description" content="El Infiltrado: juego de la palabra prohibida para jugar con amigos en un solo teléfono. Undercover, impostor ciego, temporizador y votación.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Infiltrado">
  <title>El Infiltrado · Juego de la palabra prohibida</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Orbitron', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            sans: ['Outfit', 'ui-sans-serif', 'system-ui', 'sans-serif']
          },
          colors: {
            ink: '#04050c'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="bg-fx" aria-hidden="true"></div>
  <main id="app" class="app-shell"></main>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>
    <p style="position:fixed;inset:0;display:grid;place-items:center;background:#04050c;color:#e2e8f0;font-family:sans-serif;padding:24px;text-align:center;z-index:100;">
      Necesitas activar JavaScript para jugar a El Infiltrado.
    </p>
  </noscript>
  <script src="words.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
